name: investpro
description: "InvestPro - Modern investment tracking app inspired by Groww"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  firebase_messaging: ^15.2.4

  # Networking
  dio: ^5.7.0
  web_socket_channel: ^3.0.2

  # Charts
  fl_chart: ^0.70.2

  # UI Components
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  lottie: ^3.3.1
  pin_code_fields: ^8.0.1
  local_auth: ^2.3.0
  flutter_local_notifications: ^18.0.1

  # Utilities
  intl: ^0.20.2
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  package_info_plus: ^8.1.3
  equatable: ^2.0.7
  uuid: ^4.5.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/
